<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BurkiMarket</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
      color: #ccc;
    }

    .search {
      padding: 20px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px 20px;
      background: white;
    }

    .categories button {
      border: none;
      background: #eee;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .products {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .buy {
      display: block;
      width: 100%;
      padding: 10px;
      background: #111;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>BurkiMarket</h1>
    <p>Achète et vends facilement au Burkina Faso 🇧🇫</p>
  </header>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="🔎 Rechercher un produit..."
      onkeyup="searchProducts()"
    >
  </div>

  <div class="categories">
    <button>Tout</button>
    <button>Téléphones</button>
    <button>Mode</button>
    <button>Électronique</button>
    <button>Maison</button>
  </div>

  <main class="products" id="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=500&q=80">

      <div class="product-info">
        <h3>Smartphone</h3>
        <p class="price">85 000 FCFA</p>

        <a
          class="buy"
          href="https://wa.me/22600000000"
          target="_blank"
        >
          Commander
        </a>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80">

      <div class="product-info">
        <h3>T-shirt Oversize</h3>
        <p class="price">7 000 FCFA</p>

        <a
          class="buy"
          href="https://wa.me/22600000000"
          target="_blank"
        >
          Commander
        </a>
      </div>
    </div>

  </main>

  <footer>
    © 2026 BurkiMarket — Tous droits réservés
  </footer>

  <script>
    function searchProducts() {
      const search = document
        .getElementById("search")
        .value
        .toLowerCase();

      const products = document.querySelectorAll(".product");

      products.forEach(product => {
        const name = product
          .querySelector("h3")
          .textContent
          .toLowerCase();

        if (name.includes(search)) {
          product.style.display = "block";
        } else {
          product.style.display = "none";
        }
      });
    }
  </script>

</body>
  </html>
